<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Explorar Ecuador · NASA Space Apps 2026</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#05080d;overflow:hidden}
#lienzo{width:100%;height:100%;display:block}
#carga{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#cfd8e0;font:16px system-ui,sans-serif;pointer-events:none}
</style>
</head>
<body>
<canvas id="lienzo" tabindex="-1"></canvas>
<div id="carga">Cargando visualizador… <span id="pct"></span></div>
<script src="Build/WebGL.loader.js"></script>
<script>
createUnityInstance(document.getElementById("lienzo"), {
  dataUrl: "Build/WebGL.data",
  frameworkUrl: "Build/WebGL.framework.js",
  codeUrl: "Build/WebGL.wasm",
  streamingAssetsUrl: "StreamingAssets",
  companyName: "SpaceAppsEcuador",
  productName: "Visualizador ANALOG v1",
  productVersion: "1.0",
  matchWebGLToCanvasSize: true,
  devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
}, function (p) { document.getElementById("pct").textContent = Math.round(p * 100) + " %"; })
.then(function () { document.getElementById("carga").remove(); })
.catch(function (e) { document.getElementById("carga").textContent = "Error al cargar el visualizador: " + e; });
</script>
</body>
</html>
